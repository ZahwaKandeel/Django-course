<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Course</title>
</head>
<body>
    <h1>Update Course</h1>
    <form method="POST">
        {% csrf_token %}
        <div>
            <label for="name">Course Name</label>
            <input type="text" id="name" name="name" placeholder="Enter course name">
        </div>
        <div>
            <label for="code">Course Code</label>
            <input type="text" id="code" name="code" placeholder="Enter course code">
        </div>
        <div>
            <label for="track">Course's Track Name</label>
            <input type="text" id="track" name="track" placeholder="Enter course's track name">
        </div>  
        <button type="submit">Update Course</button>  
    </form>
</body>
</html>
