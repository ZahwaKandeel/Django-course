<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Logout</title>
</head>
<body>
    <h2>You have been logged out!</h2>
    <p>Redirecting to login page...</p>
    <a href="{% url 'login' %}">Click here if not redirected</a>

    <script>
        setTimeout(function(){
            window.location.href = "{% url 'login' %}";
        }, 2000);
    </script>
</body>
</html>
