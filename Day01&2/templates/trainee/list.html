<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trainee List</title>
</head>
<body>
    <h1>Trainee List</h1>
    <table border="1">
        <tr>
            <th>Name</th>
        </tr>
        {% for trainee in traineesList %}
            <tr>
                <td>{{ trainee.name }}</td>
            </tr>
        {% endfor %}
    </table>
</body>
</html>
